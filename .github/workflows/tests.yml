name: C++ Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Full headless test suite
    # Qt is the win64_msvc2022_64 package; keep the runner on the matching
    # MSVC generation instead of following windows-latest to a newer toolset.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          cache: true

      - name: Install External Dependencies
        shell: powershell
        run: choco install yt-dlp ffmpeg --no-progress -y

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build and Run Full Test Suite
        run: python tests/run_headless_tests.py --build-dir build --config Release --verbose
