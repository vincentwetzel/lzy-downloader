name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            qt_arch: win64_msvc2022_64
          - os: ubuntu-22.04
            platform: linux
            qt_arch: gcc_64
          - os: macos-15-intel
            platform: macos
            architecture: x86_64
            qt_arch: clang_64
          - os: macos-15
            platform: macos
            architecture: arm64
            # Qt's macOS desktop archives are published as clang_64 universal
            # packages (x86_64/arm64), including for Apple-Silicon runners.
            qt_arch: clang_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade gallery-dl
          # Use yt-dlp's prerelease channel so release builds exercise the current nightly extractor/runtime.
          pip install --pre --upgrade yt-dlp

      - name: Set up MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install nsis --no-progress -y
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            throw 'NSIS installation failed: makensis.exe was not found'
          }

      - name: Install Qt 6
        if: matrix.platform == 'windows' || matrix.platform == 'linux' || matrix.platform == 'macos'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          arch: ${{ matrix.qt_arch }}
          archives: qtbase qttools
          install-deps: ${{ matrix.platform == 'linux' }}

      - name: Run Unified Release Builder
        env:
          # MSVC setup exposes its own vcpkg installation. Release CI uses
          # the prebuilt Qt SDK above instead of configuring through vcpkg.
          LZY_USE_VCPKG: '0'
          LZY_RELEASE_ARCH: ${{ matrix.architecture }}
        shell: bash
        run: |
          python build_release.py

      - name: Prepare Release Notes
        shell: bash
        run: |
          notes_path="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_path" ]]; then
            mkdir -p release-notes
            printf '# LzyDownloader %s\n\nAutomated release build for %s.\n' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" > "$notes_path"
          fi

      - name: Generate Release Checksums
        shell: bash
        run: |
          python tools/generate_release_checksums.py \
            --output "SHA256SUMS-${{ matrix.platform }}-${{ matrix.architecture || 'x86_64' }}.txt"

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LzyDownloader-Setup-*.exe
            build-release/LzyDownloader-*-x86_64.AppImage
            LzyDownloader-*-macos-x86_64.dmg
            LzyDownloader-*-macos-arm64.dmg
            SHA256SUMS-*.txt
          body_path: release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
