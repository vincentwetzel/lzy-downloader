name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-13
            platform: macos
            architecture: x86_64
            qt_arch: clang_64
          - os: macos-14
            platform: macos
            architecture: arm64
            qt_arch: clang_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade gallery-dl
          # Use yt-dlp's prerelease channel so release builds exercise the current nightly extractor/runtime.
          pip install --pre --upgrade yt-dlp

      - name: Set up MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install nsis --no-progress -y
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            throw 'NSIS installation failed: makensis.exe was not found'
          }

      - name: Install Qt 6
        if: matrix.platform == 'windows' || matrix.platform == 'macos'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.*'
          arch: ${{ matrix.platform == 'windows' && 'win64_msvc2019_64' || matrix.qt_arch }}

      - name: Set up vcpkg
        if: matrix.platform == 'windows' || matrix.platform == 'linux'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: '0b88aacde46a853151730fbe7d0b7ee45f4b6864'

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # vcpkg builds Qt Base from source and forces its XCB backend on.
          # Install development packages, not only their runtime libraries.
          sudo apt-get install -y \
            autoconf autoconf-archive automake bison curl flex libtool tar unzip zip \
            '^libxcb.*-dev' \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libx11-xcb-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxrender-dev

      - name: Run Unified Release Builder
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          LZY_RELEASE_ARCH: ${{ matrix.architecture }}
        shell: bash
        run: |
          python build_release.py

      - name: Prepare Release Notes
        shell: bash
        run: |
          notes_path="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_path" ]]; then
            mkdir -p release-notes
            printf '# LzyDownloader %s\n\nAutomated release build for %s.\n' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" > "$notes_path"
          fi

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LzyDownloader-Setup-*.exe
            LzyDownloader-*-x86_64.AppImage
            LzyDownloader-*-macos-x86_64.dmg
            LzyDownloader-*-macos-arm64.dmg
          body_path: release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
